name: build

# Builds the Enqpy(TM) C reference (Rev 5.1 -- the Canonical Configuration,
# Case-1 W generation) on clean machines and asserts that the published
# self-test reports 84 PASS / 0 FAIL. This is the verify-don't-believe claim
# made checkable: GitHub builds the artifact from a fresh checkout, on hardware
# no one controls, on every push.
#
# Beyond the self-test the workflow asserts that the reference agrees with the
# PUBLISHED vectors -- vectors_check.c, 34 assertions over every value in
# enqpy-vectors.json (three profiles, the Rev 5.1 key domain, the cosets, the
# window boundary, the Phase-1 OR_EXP expansion, the NIL key-update policy).
#
# The HDL references (VHDL and Verilog) are NOT in this repository and are not
# covered by the covenant or the Apache-2.0 grant, so cross-language interop is
# verified in NQP's private build, not here.
#
# DIAGNOSTICS: every check runs even if an earlier one fails, and the job ends
# with a summary naming each check PASS or FAIL. A red badge should never leave
# you guessing which assertion broke.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberate tripwire. Bumping the published vectors is a real event and should
  # require a conscious one-line change here, not a silent drift. If this ever
  # disagrees with the file, decide which is wrong before editing either.
  EXPECTED_VECTORS_VERSION: "5.1"

jobs:
  selftest:
    name: build + 84/84 self-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run all checks
        shell: bash
        run: |
          # Deliberately NOT 'set -e': every check runs and reports, so one run
          # tells you everything that is wrong instead of only the first thing.
          RESULTS=""
          FAILED=0
          record() {   # record <name> <0|1> [detail]
            if [ "$2" -eq 0 ]; then
              RESULTS="${RESULTS}  PASS  $1"$'\n'
            else
              RESULTS="${RESULTS}  FAIL  $1${3:+  -- $3}"$'\n'
              FAILED=1
              echo "::error::$1${3:+ -- $3}"
            fi
          }

          echo "::group::environment"
          cc --version || true
          python3 --version || true
          echo "::endgroup::"

          # ---- 0. inventory --------------------------------------------------
          echo "::group::repository inventory"
          MISSING=0
          for n in build.sh src/enqpy_reference.c src/aead_bench.c \
                   tests/vectors/enqpy-vectors.json tests/vectors/vectors_check.c; do
            if [ -e "$n" ]; then
              echo "  present  $n"
            else
              # locate without a pipeline, so pipefail can never bite
              found=$(find . -name "$(basename "$n")" -not -path './.git/*')
              first=${found%%$'\n'*}
              echo "  MISSING  $n${first:+   (found instead at: $first)}"
              MISSING=1
            fi
          done
          echo "::endgroup::"
          record "inventory: all expected paths present" "$MISSING" "see the inventory group above"

          # ---- 1. build + 84/84 ----------------------------------------------
          echo "::group::build.sh output"
          chmod +x build.sh 2>/dev/null || true
          if ./build.sh > selftest_output.txt 2>&1; then r=0; else r=1; fi
          cat selftest_output.txt 2>/dev/null || echo "(no output captured)"
          echo "::endgroup::"
          record "build.sh exits zero" "$r"

          if grep -Eq 'Self-test: 84 PASS +0 FAIL' selftest_output.txt 2>/dev/null; then r=0; else r=1; fi
          record "self-test reports 84 PASS / 0 FAIL" "$r" "pass count drifted or the binary did not run"

          if grep -q 'Self-test PASSED.' selftest_output.txt 2>/dev/null; then r=0; else r=1; fi
          record "self-test PASSED banner present" "$r"

          # ---- 2. AEAD known-answer tests -------------------------------------
          # -march=native is rejected by Apple clang on the ARM64 macOS runners,
          # so probe for it rather than assume. Benchmark numbers are not
          # asserted here, only the KATs, so the flag is optional.
          ARCHFLAG=""
          if echo 'int main(void){return 0;}' | cc -x c -march=native -o /dev/null - 2>/dev/null; then
            ARCHFLAG="-march=native"
          fi
          echo "using ARCHFLAG='$ARCHFLAG'"
          echo "::group::AEAD build + run"
          if cc -O3 $ARCHFLAG -std=c11 -D_POSIX_C_SOURCE=200809L \
                 src/aead_bench.c src/enqpy_reference.c -o aead_bench 2>&1; then r=0; else r=1; fi
          record "AEAD benchmark compiles" "$r"
          if [ "$r" -eq 0 ]; then
            if ./aead_bench > aead_output.txt 2>&1; then r2=0; else r2=1; fi
            cat aead_output.txt 2>/dev/null || true
            record "AEAD binary exits zero (all KATs pass)" "$r2"
            if grep -q 'Enqpy PASS' aead_output.txt 2>/dev/null; then r3=0; else r3=1; fi
            record "AEAD log contains 'Enqpy PASS'" "$r3"
          fi
          echo "::endgroup::"

          # ---- 3. published vectors: structure --------------------------------
          found=$(find . -name enqpy-vectors.json -not -path './.git/*')
          VEC=${found%%$'\n'*}
          if [ -n "$VEC" ]; then r=0; else r=1; fi
          record "enqpy-vectors.json found" "$r"

          if [ -n "$VEC" ]; then
            echo "using $VEC"
            if python3 -m json.tool "$VEC" > /dev/null 2>&1; then r=0; else r=1; fi
            record "enqpy-vectors.json is valid JSON" "$r"

            FOUND=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['vectors_version'])" "$VEC" 2>/dev/null || echo "?")
            if [ "$FOUND" = "$EXPECTED_VECTORS_VERSION" ]; then r=0; else r=1; fi
            record "vectors_version == $EXPECTED_VECTORS_VERSION" "$r" \
                   "file says '$FOUND'; if the bump is intended, update EXPECTED_VECTORS_VERSION in this workflow in the same commit"
          fi

          # ---- 4. published vectors: content ----------------------------------
          found=$(find . -name vectors_check.c -not -path './.git/*')
          VC=${found%%$'\n'*}
          if [ -n "$VC" ]; then r=0; else r=1; fi
          record "vectors_check.c found" "$r" \
                 "it belongs in tests/vectors/ beside the vectors it verifies; add it, or delete this check"

          if [ -n "$VC" ]; then
            found=$(find . -name enqpy_reference.c -not -path './.git/*')
            REF=${found%%$'\n'*}
            REFDIR=$(dirname "$REF")
            echo "::group::vector verification"
            echo "building $VC with -I $REFDIR"
            if cc -O2 -std=c11 -Wall -Wextra -I "$REFDIR" "$VC" -o vectors_check 2>&1; then r=0; else r=1; fi
            record "vectors_check.c compiles" "$r"
            if [ "$r" -eq 0 ]; then
              if ./vectors_check > vectors_output.txt 2>&1; then r2=0; else r2=1; fi
              cat vectors_output.txt 2>/dev/null || true
              record "every published vector reproduces from the reference" "$r2"
            fi
            echo "::endgroup::"
          fi

          # ---- summary ---------------------------------------------------------
          echo ""
          echo "=============== CHECK SUMMARY (${{ matrix.os }}) ==============="
          printf '%s' "$RESULTS"
          echo "==============================================================="
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more checks failed -- see the FAIL lines above."
            exit 1
          fi
          echo "All checks passed on ${{ matrix.os }}."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log-${{ matrix.os }}
          path: |
            selftest_output.txt
            aead_output.txt
            vectors_output.txt
          if-no-files-found: ignore
